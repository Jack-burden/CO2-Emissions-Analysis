[project]
name = "data-viz-assignment"
version = "0.1.0"
description = "Analysing the rise of co2 emissions and temperature from 1965 to 2022 using data visualisation techniques."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas (>=3.0.2,<4.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "streamlit (>=1.56.0,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "prophet (>=1.3.0,<2.0.0)",
    "pycountry (>=26.2.16,<27.0.0)",
    "pycountry-convert (>=0.7.2,<0.8.0)",
    "tabulate (>=0.10.0,<0.11.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"

